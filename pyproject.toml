[project]
name = "agentself"
dynamic = ["version"]
description = "Local identity for an agent: wallet, secrets, and optional email"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "AgentSelf" }]
keywords = [
    "agent",
    "identity",
    "wallet",
    "secrets",
    "email",
    "cli",
    "local",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dependencies = [
    "eth-account>=0.13.7,<0.14",
]

[project.urls]
Homepage = "https://github.com/agentself/agentself"
Repository = "https://github.com/agentself/agentself"
Issues = "https://github.com/agentself/agentself/issues"

[project.scripts]
agentself = "agentself.__main__:run"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentself*"]

[tool.setuptools.package-data]
agentself = ["skills/agentself/SKILL.md"]

[tool.setuptools.dynamic]
version = {attr = "agentself.__version__"}

[dependency-groups]
dev = ["pytest", "mypy>=1.8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["agentself"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
files = ["agentself"]

[[tool.mypy.overrides]]
module = ["eth_account", "eth_account.*", "eth_utils"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agentself"]
known-local-folder = ["tests"]

[tool.ruff.format]
quote-style = "double"
