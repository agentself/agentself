# Tag-triggered publish via Trusted Publishing (OIDC). No API token.
# Before the first `v[0-9]*` tag publish, create protected GitHub environments
# `pypi` and `testpypi`, then register this workflow as a trusted publisher
# on PyPI and TestPyPI (GitHub/PyPI UIs). CI does not register the project
# name. `agentself` had no published distribution when this workflow was added.
# Actions are pinned to full commit SHAs (with the release tag kept in comments).
# Tag must be v${__version__}. Publish reuses the dist/ the test workflow
# built and smoke-tested for this SHA; it does not rebuild an untested wheel.
name: publish

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  # Reusable workflows cannot request more than the caller grants.
  # test.yml needs actions: write for setup-python's pip cache.
  ci:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      actions: write

  verify-dist:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Require tag v${VERSION} from the tested wheel
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/wheel-env"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install dist/*.whl
          version="$("$venv/bin/python" -c "from agentself import __version__; print(__version__)")"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${expected}" >&2
            exit 1
          fi
          empty="${RUNNER_TEMP}/empty"
          mkdir -p "$empty"
          export PATH="$venv/bin:$PATH"
          cd "$empty"
          got="$(agentself --version)"
          test "$got" = "agentself ${version}"
          agentself --help

  publish-testpypi:
    needs: verify-dist
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agentself
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [verify-dist, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentself
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
