# Support matrix (CI-tested on main, tags, merge queue, workflow_dispatch):
#   ubuntu-latest, windows-latest × Python 3.11/3.12
#   macos-latest × Python 3.11
# Pull requests skip macOS and Windows 3.11.
# ruff on one Ubuntu job. Artifact job waits for lint and pytest, then builds
# wheel+sdist, twine-checks, acceptance-tests a non-editable wheel install
# (not pip install -e), and uploads dist/ for tag publish to reuse.
# Live `pass` / `init --store pass` smoke is Ubuntu-only (`pass` is a Unix CLI).
name: test

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions: write is required to save setup-python's pip cache.
permissions:
  contents: read
  actions: write

env:
  AGE_VERSION: v1.3.1
  SOPS_VERSION: v3.13.3
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff and mypy
        run: python -m pip install ruff "mypy>=1.8"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy agentself

  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install age, sops, pass, and gnupg (Linux)
        if: runner.os == 'Linux'
        run: bash .github/scripts/linux-host-tools.sh
      - name: Install age and sops (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.github/scripts/windows-host-tools.ps1"
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Test
        run: python -m pytest

  test-full:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install age and sops (macOS)
        if: runner.os == 'macOS'
        run: bash .github/scripts/macos-host-tools.sh
      - name: Install age and sops (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.github/scripts/windows-host-tools.ps1"
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Test
        run: python -m pytest

  artifact:
    name: wheel and sdist
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install age, sops, pass, and gnupg
        run: bash .github/scripts/linux-host-tools.sh
      - name: Build and check artifacts
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Acceptance-test the wheel
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/wheel-env"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install dist/*.whl pytest
          AGENTSELF_ACCEPTANCE_EXE="$venv/bin/agentself" \
            "$venv/bin/python" -m pytest -q acceptance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
