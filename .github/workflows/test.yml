# Support matrix (CI-tested):
#   ubuntu-latest, windows-latest × Python 3.11/3.12
#   macos-latest × Python 3.11
# ruff on one Ubuntu job. Artifact job builds wheel+sdist, twine-checks,
# and smoke-tests a non-editable wheel install (not pip install -e).
# Live `pass` / `init --store pass` smoke is Ubuntu-only (`pass` is a Unix CLI).
name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install ruff and mypy
        run: python -m pip install ruff "mypy>=1.8"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy agentself

  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install age, sops, pass, and gnupg (Linux)
        if: runner.os == 'Linux'
        env:
          AGE_VERSION: v1.3.1
          SOPS_VERSION: v3.13.3
        run: bash .github/scripts/linux-host-tools.sh
      - name: Install age and sops (macOS)
        if: runner.os == 'macOS'
        env:
          AGE_VERSION: v1.3.1
          SOPS_VERSION: v3.13.3
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/host-tools"
          mkdir -p "$dest"
          arch=$(uname -m)
          case "$arch" in
            x86_64|amd64) goarch=amd64 ;;
            arm64|aarch64) goarch=arm64 ;;
            *) echo "unsupported arch $arch" >&2; exit 1 ;;
          esac
          case "${AGE_VERSION}:${goarch}" in
            v1.3.1:amd64) age_sha256=2b233301ad21ab7b1eabd9ae1198a164005fa4928fcdd745d47c39f8593209d7 ;;
            v1.3.1:arm64) age_sha256=01120ea2cbf0463d4c6bd767f99f3271bbed1cdc8a9aa718a76ba1fe4f01998b ;;
            *) echo "no pinned age checksum for ${AGE_VERSION}/${goarch}" >&2; exit 1 ;;
          esac
          case "${SOPS_VERSION}:${goarch}" in
            v3.13.3:amd64) sops_sha256=42162d5cef10b74fcf80a045a70e658d7ce6e63d6ea1be6f347e44015714468d ;;
            v3.13.3:arm64) sops_sha256=b97c0d434aab577dc40310e8d22ff9e45eef4c80638ab978daae9b4681c59286 ;;
            *) echo "no pinned sops checksum for ${SOPS_VERSION}/${goarch}" >&2; exit 1 ;;
          esac
          age_archive="${RUNNER_TEMP}/age.tgz"
          curl -fsSL -o "$age_archive" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-darwin-${goarch}.tar.gz"
          printf '%s  %s\n' "$age_sha256" "$age_archive" | shasum -a 256 -c
          tar -xzf "$age_archive" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/age/age" "$dest/age"
          install -m 0755 "${RUNNER_TEMP}/age/age-keygen" "$dest/age-keygen"
          rm -rf "${RUNNER_TEMP}/age" "$age_archive"
          curl -fsSL -o "$dest/sops" \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.darwin.${goarch}"
          printf '%s  %s\n' "$sops_sha256" "$dest/sops" | shasum -a 256 -c
          chmod 0755 "$dest/sops"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/age" --version
          "$dest/sops" --version
      - name: Install age and sops (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGE_VERSION: v1.3.1
          SOPS_VERSION: v3.13.3
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "host-tools"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $ageZip = Join-Path $env:RUNNER_TEMP "age.zip"
          if ($env:AGE_VERSION -eq "v1.3.1") {
            $ageSha256 = "c56e8ce22f7e80cb85ad946cc82d198767b056366201d3e1a2b93d865be38154"
          } else {
            throw "no pinned age checksum for $env:AGE_VERSION/windows-amd64"
          }
          if ($env:SOPS_VERSION -eq "v3.13.3") {
            $sopsSha256 = "a4a9a398858fe8b2ef72d9686d930bf7c5cece9be74ad83ac3b53cfdd70e6b1c"
          } else {
            throw "no pinned sops checksum for $env:SOPS_VERSION/windows-amd64"
          }
          curl.exe -fsSL -o $ageZip "https://github.com/FiloSottile/age/releases/download/$env:AGE_VERSION/age-$env:AGE_VERSION-windows-amd64.zip"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $ageZip).Hash -ne $ageSha256) {
            throw "age checksum mismatch"
          }
          tar -xf $ageZip -C $env:RUNNER_TEMP
          Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP "age") -File |
            Where-Object { $_.Name -in @("age.exe", "age-keygen.exe") } |
            ForEach-Object { Copy-Item $_.FullName -Destination (Join-Path $dest $_.Name) }
          $sopsPath = Join-Path $dest "sops.exe"
          curl.exe -fsSL -o $sopsPath "https://github.com/getsops/sops/releases/download/$env:SOPS_VERSION/sops-$env:SOPS_VERSION.amd64.exe"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $sopsPath).Hash -ne $sopsSha256) {
            throw "sops checksum mismatch"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dest
          & (Join-Path $dest "age.exe") --version
          & (Join-Path $dest "sops.exe") --version
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Test
        run: python -m pytest

  artifact:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install age, sops, pass, and gnupg
        env:
          AGE_VERSION: v1.3.1
          SOPS_VERSION: v3.13.3
        run: bash .github/scripts/linux-host-tools.sh
      - name: Build and check artifacts
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        env:
          AGENTSELF_FETCH_TOOLS: "0"
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/wheel-env"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install dist/*.whl
          empty="${RUNNER_TEMP}/empty"
          mkdir -p "$empty"
          export PATH="$venv/bin:$PATH"
          cd "$empty"
          version="$("$venv/bin/python" -c "from agentself import __version__; print(__version__)")"
          got="$(agentself --version)"
          test "$got" = "agentself ${version}"
          agentself --help
          agentself backends
          export AGENTSELF_IDENTITY_DIR="${RUNNER_TEMP}/agentself-identity-sops"
          agentself diagnose
          agentself init
          agentself --json diagnose
          agentself install --skills=agents
          test -f "${empty}/.agents/skills/agentself/SKILL.md"
          export AGENTSELF_IDENTITY_DIR="${RUNNER_TEMP}/agentself-identity-pass"
          agentself init --store pass
          agentself --json diagnose
